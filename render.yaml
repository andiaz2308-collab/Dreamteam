# Render free: runtime Python (sin Docker).
# Evita el fallo "pushing layers" de imágenes grandes con Tesseract.
# OCR de PDF escaneado no estará en este host; PDF con texto y DOCX sí.
services:
  - type: web
    name: agentecv
    runtime: python
    plan: free
    # --no-cache-dir evita OOM/disco en free tier al instalar PyMuPDF.
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AGENT_USER_ID
        sync: false
