services:
  agentecv:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      PORT: "7860"
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
