<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi CV — AgenteCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#6D4AFF",
              canvas: "#F7F7F8",
              ink: "#18181B",
              success: "#22A06B",
              warning: "#E6A700",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-canvas font-sans text-ink">
    <div id="sidebar-backdrop" class="fixed inset-0 z-20 hidden bg-zinc-900/20 lg:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 flex w-64 -translate-x-full flex-col border-r border-zinc-200 bg-white px-4 py-6 transition-transform lg:translate-x-0">
      <div class="mb-8 flex items-center justify-between px-2">
        <p class="text-sm font-semibold">AgenteCV</p>
        <button type="button" class="lg:hidden" data-close-sidebar aria-label="Cerrar menú">✕</button>
      </div>
      <nav class="flex flex-1 flex-col gap-1 text-sm">
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/dashboard">Dashboard</a>
        <a class="sidebar-link active rounded-lg px-3 py-2" href="/cv">Mi CV</a>
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/opportunities">Oportunidades</a>
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/applications">Postulaciones</a>
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/settings">Configuración</a>
      </nav>
    </aside>

    <div class="lg:pl-64">
      <header class="flex items-center justify-between border-b border-zinc-200 bg-white/80 px-4 py-3 backdrop-blur lg:px-8">
        <button id="menu-toggle" type="button" class="rounded-lg px-2 py-1 text-sm lg:hidden" aria-expanded="false" aria-controls="sidebar">Menú</button>
        <p class="text-sm text-zinc-500">CV maestro</p>
      </header>

      <main class="px-4 py-8 lg:px-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">CV Maestro</h1>
            <p class="mt-1 text-sm text-zinc-500">El CV maestro no se modifica. Esta vista muestra el perfil estructurado.</p>
          </div>
          <span id="profile-status" class="badge badge-success">CV analizado</span>
        </div>

        <section class="card mt-8 p-6">
          <p class="text-xs font-medium uppercase tracking-wider text-zinc-400">Candidata</p>
          <p id="profile-name" class="mt-2 text-xl font-semibold"></p>
          <p id="profile-title" class="text-sm text-zinc-600"></p>
        </section>

        <div id="profile-sections" class="mt-6 grid gap-4 lg:grid-cols-2"></div>
      </main>
    </div>

    <script type="module" src="/js/cv.js"></script>
  </body>
</html>
