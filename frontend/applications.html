<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postulaciones — AgenteCV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#6D4AFF",
              canvas: "#F7F7F8",
              ink: "#18181B",
              success: "#22A06B",
              warning: "#E6A700",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="min-h-screen bg-canvas font-sans text-ink">
    <div id="sidebar-backdrop" class="fixed inset-0 z-20 hidden bg-zinc-900/20 lg:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 flex w-64 -translate-x-full flex-col border-r border-zinc-200 bg-white px-4 py-6 transition-transform lg:translate-x-0">
      <div class="mb-8 flex items-center justify-between px-2">
        <p class="text-sm font-semibold">AgenteCV</p>
        <button type="button" class="lg:hidden" data-close-sidebar aria-label="Cerrar menú">✕</button>
      </div>
      <nav class="flex flex-1 flex-col gap-1 text-sm">
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/dashboard">Dashboard</a>
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/cv">Mi CV</a>
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/opportunities">Oportunidades</a>
        <a class="sidebar-link active rounded-lg px-3 py-2" href="/applications">Postulaciones</a>
        <a class="sidebar-link rounded-lg px-3 py-2 text-zinc-600 hover:bg-zinc-50" href="/settings">Configuración</a>
      </nav>
    </aside>

    <div class="lg:pl-64">
      <header class="flex items-center justify-between border-b border-zinc-200 bg-white/80 px-4 py-3 backdrop-blur lg:px-8">
        <button id="menu-toggle" type="button" class="rounded-lg px-2 py-1 text-sm lg:hidden" aria-expanded="false" aria-controls="sidebar">Menú</button>
        <p class="text-sm text-zinc-500">Postulaciones</p>
      </header>

      <main class="px-4 py-8 lg:px-8">
        <h1 class="text-2xl font-semibold tracking-tight">Mis postulaciones</h1>
        <p class="mt-1 text-sm text-zinc-500">Cola interna. Sin envíos a plataformas externas.</p>
        <p id="applications-status" class="mt-2 text-sm text-red-700"></p>
        <div class="mt-6">
          <button id="create-demo" type="button" class="btn-primary rounded-xl px-4 py-2 text-sm font-medium">
            Crear postulación de demo
          </button>
        </div>
        <div id="applications-table" class="card mt-8 overflow-hidden"></div>
      </main>
    </div>

    <div id="review-modal" class="fixed inset-0 z-40 hidden">
      <div class="absolute inset-0 bg-zinc-900/30" id="close-review-backdrop"></div>
      <div class="card relative z-10 mx-auto mt-24 max-w-lg p-6">
        <h2 class="text-base font-semibold">Revisión de postulación</h2>
        <div id="review-body" class="mt-4"></div>
        <button id="close-review" type="button" class="mt-6 rounded-xl border border-zinc-200 px-4 py-2 text-sm">Cerrar</button>
      </div>
    </div>

    <script type="module" src="/js/applications.js"></script>
  </body>
</html>
